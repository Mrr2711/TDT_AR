<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gantt 3D AR</title>
    <style>
        * { margin: 0; padding: 0; }
        body { background: #000; overflow: hidden; }
        model-viewer { 
            width: 100%; 
            height: 100vh; 
            display: block;
        }
    </style>
</head>
<body>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <model-viewer 
        src="gantt.usdz.gz" 
        alt="Gantt 3D"
        shadow-intensity="1"
        camera-controls
        auto-rotate
        interaction-prompt="none">
    </model-viewer>
</body>
</html>
